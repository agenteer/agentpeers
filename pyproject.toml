[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentpeers"
version = "0.7.0"
description = "Let your Codex and Claude Code sessions talk to each other."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Agenteer LLC"}]
classifiers = ["Operating System :: MacOS :: MacOS X", "Programming Language :: Python :: 3 :: Only"]

[project.urls]
Homepage = "https://github.com/agenteer/agentpeers"
Repository = "https://github.com/agenteer/agentpeers"
Issues = "https://github.com/agenteer/agentpeers/issues"

[project.scripts]
agentpeers = "agentpeers.cli:main"

[tool.setuptools.packages.find]
include = ["agentpeers*"]
